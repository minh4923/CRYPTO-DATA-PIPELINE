volumes:
  bitcoin-pipeline-redpanda:
    external: true
  bitcoin-pipeline-data:
    external: true
  bitcoin-pipeline-airflow-postgres:
    external: true
  bitcoin-pipeline-postgres:
    external: true
networks:
  bitcoin-pipeline-network:
    external: true
x-airflow-common: &airflow-common
  image: airflow_base:v1.0
  env_file: ./batch/airflow/local.env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor # chay trong 1 container khong phai distributed executor(schedule lam het bo worker)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "xOkzhzym950DW_hYuIu0zPau7uTVcETuJZAn64-OtWw="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./batch/airflow/dags:/opt/airflow/dags:rw
    - ./batch/airflow/logs:/opt/airflow/logs:rw
    - ./batch/spark/jobs:/opt/spark/jobs:rw
    - bitcoin-pipeline-data:/opt/data:rw
  networks:
    - bitcoin-pipeline-network
  user: "1000:0"
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:15.3
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - bitcoin-pipeline-airflow-postgres:/var/lib/postgresql/data:rw
    networks:
      - bitcoin-pipeline-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:15.3
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ohlcv
    volumes:
      - bitcoin-pipeline-postgres:/var/lib/postgresql/data:rw
    networks:
      - bitcoin-pipeline-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ohlcv"]
      interval: 10s
      timeout: 5s
      retries: 5
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    environment:
      <<: *airflow-common-env
      SHELL: "/bin/bash"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-postgres:
        condition: service_healthy
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    environment:
      <<: *airflow-common-env
      SHELL: "/bin/bash"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    build: batch/airflow
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "1000" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        mkdir -p /opt/data/temp
        chown -R "1000:0" /opt/data/temp
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
  spark-master:
    image: spark_master:v1.0
    build:
      context: ./batch/spark
      target: spark-master
    container_name: spark-master
    environment:
      SPARK_LOCAL_IP: spark-master
      SPARK_MASTER_PORT: 7077
    ports:
      - 8087:8080
      - 7077:7077
    volumes:
      - ./batch/spark/jobs:/opt/spark/jobs:rw
      - bitcoin-pipeline-data:/opt/data:rw
    networks:
      - bitcoin-pipeline-network
  spark-worker-0:
    image: spark_worker:v1.0
    build:
      context: ./batch/spark
      target: spark-worker
    container_name: spark-worker-0
    environment:
      SPARK_LOCAL_IP: spark-worker-0
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - bitcoin-pipeline-data:/opt/data:rw
      - ./batch/spark/data:/opt/spark/data:rw
    ports:
      - 8081:8081
    networks:
      - bitcoin-pipeline-network
    depends_on:
      - spark-master
  spark-worker-1:
    image: spark_worker:v1.0
    container_name: spark-worker-1
    environment:
      SPARK_LOCAL_IP: spark-worker-1
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 2g
    ports:
      - 8082:8081
    volumes:
      - bitcoin-pipeline-data:/opt/data:rw
      - ./batch/spark/data:/opt/spark/data:rw
    networks:
      - bitcoin-pipeline-network
    depends_on:
      - spark-master
